[project]
name = "urban-elements-reid-challenge"
version = "0.1.0"
description = "Instance-level re-identification of urban objects (containers, crosswalks, rubbish bins, traffic signs) across multiple cameras."
readme = "README.md"
authors = [
    { name = "MahibulHaque", email = "mahibulhaque2000@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "einops>=0.8.2",
    "grad-cam>=1.5.7",
    "numpy<2",
    "opencv-python>=4.11.0.86",
    "pandas>=2.3.3",
    "sam3>=0.1.4",
    "scikit-image>=0.25.2",
    "tensorboard>=2.21.0",
    "timm>=1.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "torchvision>=0.15.0",
    "yacs>=0.1.8",
]

[project.scripts]
urban-elements-reid-challenge = "urban_elements_reid_challenge:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"
